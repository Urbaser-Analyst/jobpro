<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Inventory & Job Card System</title>
<link rel="icon" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/img/logo.svg" alt="Logo">
        <div class="brand-text">Fleet Inventory<small>Job Card System</small></div>
      </div>

      <nav id="navMount"><!-- built by dashboard.js based on role --></nav>

      <div class="sidebar-footer">
        <div class="who" id="whoName">—</div>
        <div id="whoRole">—</div>
        <a href="#" id="logoutLink" style="color:#F26A8D;">Sign out</a>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h2 id="pageTitle">Dashboard</h2>
        <div class="flex gap-12">
          <span class="muted" id="clock" style="font-size:12.5px;"></span>
        </div>
      </div>
      <div class="content" id="contentMount">
        <!-- module content injected here -->
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/combo.js"></script>
  <script src="assets/js/imagePicker.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/module.productMaster.js"></script>
  <script src="assets/js/module.mrf.js"></script>
  <script>Dashboard.init();</script>
</body>
</html>
